<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A client-side password generator using Web Crypto randomness with privacy-first optional history." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Password Generator" />
    <meta property="og:description" content="A client-side password generator using Web Crypto randomness with privacy-first optional history." />
    <meta name="twitter:card" content="summary" />

    <title>Password Generator</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main class="container">
      <h1>Password Generator</h1>
      <p class="status" role="status" aria-live="polite">Generate a password locally in your browser.</p>
      <section class="options" aria-labelledby="options-title">
        <h2 id="options-title">Options</h2>
        <label for="length">Password length</label>
        <input class="pass-length" type="number" id="length" value="16" min="8" max="64" step="1" inputmode="numeric" />
        <label for="include-numbers">
          <input type="checkbox" id="include-numbers" checked />
          Include numbers
        </label>
        <label for="include-special">
          <input type="checkbox" id="include-special" checked />
          Include special characters
        </label>
        <label for="save-history">
          <input type="checkbox" id="save-history" />
          Save generated passwords in this browser (not recommended)
        </label>
      </section>
      <div class="actions">
        <button class="generate" id="generate" type="button">Generate password</button>
        <button class="copy" id="copy-password" type="button" disabled>Copy password</button>
      </div>
      <output id="password" class="result" aria-label="Generated password">Password will appear here</output>
      <section class="history" aria-labelledby="history-title">
        <h2 id="history-title">Local history</h2>
        <p class="privacy-note">History is off by default. Generated passwords are not sent over the network.</p>
        <div id="saved-passwords" class="saved-passwords">History is disabled by default for your safety.</div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
